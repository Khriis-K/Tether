[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tether"
version = "0.1.0"
description = "Real-time multi-object tracker that keeps stable IDs on fast-moving and temporarily blocked objects."
license = "AGPL-3.0-only"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
test = ["pytest>=7", "trackeval==1.3.0", "onnx==1.23.2"]  # onnx builds stand-in models
demo = ["onnxruntime>=1.18", "opencv-python>=4.8"]  # tether-demo
eval = ["trackeval==1.3.0"]  # tether-mot17; a numpy-2 fork of TrackEval, same metric code
bytetrack = ["ultralytics==8.4.181", "lap==0.5.12"]  # tether-bytetrack, the MOT17 baseline
export = ["ultralytics==8.4.181", "onnx==1.23.2"]  # tools/export_model.py only

[project.scripts]
tether-track = "tether.cli:main"
tether-demo = "tether.demo:main"
tether-timing = "tether.timing:main"
tether-mot17 = "tether.mot17:main"
tether-bytetrack = "tether.bytetrack:main"
tether-antiuav = "tether.antiuav:main"
tether-antiuav-split = "tether.antiuav_split:main"
tether-antiuav-detect = "tether.antiuav_detect:main"
tether-drone-score = "tether.drone_score:main"
tether-drone-score-images = "tether.drone_score:main_images"
tether-empty-sky = "tether.empty_sky:main"
tether-image-detect = "tether.image_detect:main"
tether-transfer-sets = "tether.transfer_sets:main"
tether-drone-dataset = "tether.drone_dataset:main"
tether-parity = "tether.parity:main"
tether-pipeline-compare = "tether.pipeline_compare:main"
tether-mode-compare = "tether.mode_compare:main"
tether-runtime-compare = "tether.runtime_compare:main"
tether-model-compare = "tether.model_compare:main"

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
pythonpath = ["python"]
