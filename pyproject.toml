[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tether"
version = "0.1.0"
description = "Real-time multi-object tracker that keeps stable IDs on fast-moving and temporarily blocked objects."
license = "AGPL-3.0-only"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
tether-track = "tether.cli:main"

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
pythonpath = ["python"]
